[project]
name = "fine-tuning"
version = "0.1.0"
description = "7B LoRA fine-tuned model training and deployment"
readme = "README.md"
requires-python = ">=3.10,<3.12"

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.37.0",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.42.0",
    "peft>=0.8.0",
    "datasets>=2.16.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "safetensors>=0.4.2"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]